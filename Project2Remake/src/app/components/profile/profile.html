
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand text-danger fw-bold fs-3" href="index.html">vGT rent</a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm">Return to Fleet</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="profile-sidebar text-center">
                    <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="profile-big-img">
                    <h3 class="fw-bold" id="dashName">Guest</h3>
                    <p class="text-secondary small">Premium Member</p>
                    <hr class="border-secondary">
                    <div class="text-start mt-3">
                        <p><i class="fa-solid fa-envelope text-danger me-2"></i> <span id="dashEmail">---</span></p>
                        <p><i class="fa-solid fa-phone text-danger me-2"></i> <span id="dashPhone">---</span></p>
                    </div>
                    <div class="d-flex gap-2 justify-content-center">
                        <button class="btn btn-danger w-50" (click)="handleLogout()">Log Out</button>
                        <a routerLink="/add-car" class="btn btn-outline-danger w-50">Add a car</a>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="mb-5">
                    <h4 class="section-title">My Rental History</h4>
                    <div id="history-list" onclick="window.location.href='carpage.html?id=${car.id}'" style="cursor: pointer;">
                        @for ( p of purchaseHistory; track p) {
                            <div class="purchase-item history-card">
                                <h5>{{ p.carModel }}</h5>
                                <p>Price: {{ p.pricePaid }}</p>
                                
                            </div>
                        }
                    </div>
                </div>

                <div id="favorites-section">
                    <h4 class="section-title">My Favorites</h4>
                    <div class="row" id="likedCars">
                        @for ( f of FavCarts; track f) {
                            <div class="purchase-item history-card" >
                                <h5>{{ f.brand }} {{ f.model }}</h5>
                                <p>Price: {{ f.price }}</p>
                            </div>

                        }
                    </div>
                </div>
            </div>
        </div>
    </div>
